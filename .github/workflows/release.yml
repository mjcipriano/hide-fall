name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apks:
    runs-on: ubuntu-latest
    env:
      HIDEFALL_ANDROID_KEYSTORE_BASE64: ${{ secrets.HIDEFALL_ANDROID_KEYSTORE_BASE64 }}
      HIDEFALL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIDEFALL_ANDROID_KEYSTORE_PASSWORD }}
      HIDEFALL_ANDROID_KEY_ALIAS: ${{ secrets.HIDEFALL_ANDROID_KEY_ALIAS }}
      HIDEFALL_ANDROID_KEY_PASSWORD: ${{ secrets.HIDEFALL_ANDROID_KEY_PASSWORD }}
      HIDEFALL_ANDROID_CERT_SHA256: ${{ secrets.HIDEFALL_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: hidefall
          auto-activate-base: false

      - name: Resolve release version
        id: version
        shell: bash -el {0}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0, got: ${release_tag}" >&2
            exit 1
          fi
          version="${release_tag#v}"
          {
            echo "tag=${release_tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Godot
        shell: bash -el {0}
        run: make install-godot

      - name: Install Godot export templates
        shell: bash -el {0}
        run: make install-export-templates

      - name: Install Android SDK
        shell: bash -el {0}
        run: make install-android-sdk

      - name: Require release signing secrets
        shell: bash -el {0}
        run: make require-release-signing

      - name: Run tests
        shell: bash -el {0}
        run: make test

      - name: Build APKs
        shell: bash -el {0}
        run: make build-apks

      - name: Verify APK artifacts
        shell: bash -el {0}
        run: make verify-apks

      - name: Write checksums and release notes
        shell: bash -el {0}
        run: |
          cd build
          cp hidefall-quest.apk "hidefall-quest-${{ steps.version.outputs.version }}.apk"
          cp hidefall-mobile.apk "hidefall-mobile-${{ steps.version.outputs.version }}.apk"
          sha256sum "hidefall-quest-${{ steps.version.outputs.version }}.apk" "hidefall-mobile-${{ steps.version.outputs.version }}.apk" > SHA256SUMS
          cat > "RELEASE_NOTES.md" <<EOF
          # Hidefall ${{ steps.version.outputs.version }}

          APKs built from tag `${{ steps.version.outputs.tag }}` and signed with the project upload key.

          ## Assets

          - `hidefall-quest-${{ steps.version.outputs.version }}.apk`: Quest host/seeker release build.
          - `hidefall-mobile-${{ steps.version.outputs.version }}.apk`: Android hider client release build.
          - `SHA256SUMS`: SHA-256 checksums for both APKs.

          These APKs use the persistent Hidefall upload signing key from GitHub Secrets so upgrades install over earlier builds signed by the same key.
          EOF

      - name: Create GitHub release
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/hidefall-quest-${{ steps.version.outputs.version }}.apk \
            build/hidefall-mobile-${{ steps.version.outputs.version }}.apk \
            build/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Hidefall ${{ steps.version.outputs.version }}" \
            --notes-file build/RELEASE_NOTES.md \
            --verify-tag
