name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: hidefall
          auto-activate-base: false

      - name: Resolve release version
        id: version
        shell: bash -el {0}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0, got: ${release_tag}" >&2
            exit 1
          fi
          version="${release_tag#v}"
          {
            echo "tag=${release_tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Godot
        shell: bash -el {0}
        run: make install-godot

      - name: Install Godot export templates
        shell: bash -el {0}
        run: make install-export-templates

      - name: Install Android SDK
        shell: bash -el {0}
        run: make install-android-sdk

      - name: Run tests
        shell: bash -el {0}
        run: make test

      - name: Build APKs
        shell: bash -el {0}
        run: make build-apks

      - name: Verify APK signatures
        shell: bash -el {0}
        run: |
          apksigner="${ANDROID_SDK_ROOT:-${PWD}/tools/android-sdk}/build-tools/35.0.0/apksigner"
          "${apksigner}" verify --verbose build/hidefall-quest-debug.apk
          "${apksigner}" verify --verbose build/hidefall-mobile-debug.apk

      - name: Write checksums and release notes
        shell: bash -el {0}
        run: |
          cd build
          sha256sum hidefall-quest-debug.apk hidefall-mobile-debug.apk > SHA256SUMS
          cat > "RELEASE_NOTES.md" <<EOF
          # Hidefall ${{ steps.version.outputs.version }}

          Debug APKs built from tag `${{ steps.version.outputs.tag }}`.

          ## Assets

          - `hidefall-quest-debug.apk`: Quest host/seeker build.
          - `hidefall-mobile-debug.apk`: Android hider client build.
          - `SHA256SUMS`: SHA-256 checksums for both APKs.

          These are debug-signed APKs for installation/testing. Release signing is intentionally separate until production signing credentials are configured.
          EOF

      - name: Create GitHub release
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/hidefall-quest-debug.apk \
            build/hidefall-mobile-debug.apk \
            build/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Hidefall ${{ steps.version.outputs.version }}" \
            --notes-file build/RELEASE_NOTES.md \
            --verify-tag
